name: Daily RSS Health Check

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨 2:00 自动运行
  workflow_dispatch:     # 允许手动触发运行

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 签出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        pip install requests

    - name: 运行死链检测脚本
      run: python check_rss.py

    - name: 提交并推送到仓库
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add data/sources.json
        git diff-index --quiet HEAD || git commit -m "chore: 定时更新 RSS 状态包"
        git push

        - name: 部署到 GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages # 发布到 gh-pages 分支
        folder: .        # 推送当前整个目录
        clean: false     # 关键：不要让插件误删或者覆盖其他静态资源
