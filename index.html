<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">极简优质 RSS 导航</title>
    <!-- 引入 Tailwind CSS 提升颜值 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .active-btn { @apply bg-blue-600 text-white!important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-12">

    <!-- 顶部导航与语言切换 -->
    <header class="bg-white shadow-xs sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                <span>🌐</span> <span id="nav-logo">Best RSS List</span>
            </h1>
            <div class="flex gap-4">
                <!-- 导出 OPML 核心跨越功能 -->
                <button onclick="exportOPML()" id="btn-export" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer">
                    📥 导出 OPML
                </button>
                <!-- 语言切换按钮 -->
                <button onclick="toggleLanguage()" id="btn-lang" class="border border-gray-300 hover:bg-gray-100 px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer">
                    English
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <!-- 介绍区 -->
        <section class="text-center my-12">
            <h2 id="main-heading" class="text-3xl font-extrabold text-gray-900 sm:text-4xl">全球优质 RSS 源精选</h2>
            <p id="main-sub" class="mt-3 max-w-2xl mx-auto text-xl text-gray-500 sm:mt-4">聚合全球极具价值的订阅源，每日动态检测，支持一键导入阅读器。</p>
        </section>

        <!-- 分类过滤器 -->
        <div class="flex flex-wrap gap-2 justify-center mb-8" id="filter-container">
            <!-- 动态生成 -->
        </div>

        <!-- RSS 列表网格（原项目是枯燥的表格，我们用现代卡片流） -->
        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" id="rss-grid">
            <!-- 动态生成 -->
        </div>
    </main>

    <script>
        // 1. 多语言字典配置
        const i18n = {
            zh: {
                title: "极简优质 RSS 导航",
                logo: "精选 RSS 导航",
                heading: "全球优质 RSS 源精选",
                sub: "聚合全球极具价值的订阅源，每日动态检测，支持一键导入阅读器。",
                exportBtn: "📥 导出选中/全部",
                langBtn: "English",
                copied: "已复制到剪贴板！",
                all: "全部",
                tech: "💻 技术与开发",
                blog: "💡 独立博客",
                news: "📰 资讯周刊",
                statusActive: "🟢 在线",
                statusDead: "🔴 失效",
                copyBtn: "复制链接"
            },
            en: {
                title: "Premium RSS Directory",
                logo: "Best RSS List",
                heading: "Curated Premium RSS Feeds",
                sub: "Global high-value subscription feeds, daily health check, one-click export to your reader.",
                exportBtn: "📥 Export OPML",
                langBtn: "简体中文",
                copied: "Copied to clipboard!",
                all: "All",
                tech: "💻 Tech & Dev",
                blog: "💡 Blogs & Thoughts",
                news: "📰 News & Weekly",
                statusActive: "🟢 Active",
                statusDead: "🔴 Dead",
                copyBtn: "Copy Link"
            }
        };

        // 2. 模拟数据源（实际应用中可通过自动化脚本将 sources.json 转换为此变量）
       // 2. 声明空数组，等待异步加载
        let rssData = [];
        let currentLang = 'zh';
        let currentCategory = 'all';

        // 3. 语言切换逻辑
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.documentElement.lang = currentLang;
            renderUI();
        }

        // 4. 渲染界面 (保持你之前的 renderUI 代码不变)
        function renderUI() {
            // ... 这里是你之前 index.html 里的 renderUI 内部逻辑，无需修改 ...
        }

        // 5. 分类筛选 (保持不变)
        function filterCategory(cat) { currentCategory = cat; renderUI(); }
        // 6. 一键复制 (保持不变)
        function copyToClipboard(text) { ... }
        // 7. 导出 OPML (保持不变)
        function exportOPML() { ... }

        // 修改初始化入口：先读取 JSON 文件，再渲染页面
        async function init() {
            try {
                // 自动读取同目录下的 data/sources.json
                const response = await fetch('./data/sources.json');
                rssData = await response.json();
                renderUI();
            } catch (error) {
                console.error("加载 RSS 数据失败:", error);
            }
        }

        // 执行初始化
        init();
        // 初始化加载
        renderUI();
    </script>
</body>
</html>
